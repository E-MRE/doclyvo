<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .primarybtn:disabled { opacity: 0.55; }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 6px; border-radius: 8px; display:flex; align-items:center; justify-content:center; }
    .iconbtn:disabled { opacity: 0.35; cursor: default; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .primarybtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <button class="iconbtn" style="color:{{textSoft}}; padding:4px;" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span style="font-weight:700; font-size:16px;">Redakte Et</span>
  </div>

  <div style="padding:20px 16px 32px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <div style="font-size:12px; font-weight:600; color:{{textSoft}};">sozlesme.pdf</div>
      <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:{{textSoft}};">
        <button class="iconbtn" onClick="{{prevPage}}" disabled="{{noPrevPage}}" aria-label="Önceki sayfa" style="color:{{textSoft}}; padding:2px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        Sayfa {{currentPage}} / {{totalPages}}
        <button class="iconbtn" onClick="{{nextPage}}" disabled="{{noNextPage}}" aria-label="Sonraki sayfa" style="color:{{textSoft}}; padding:2px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:5px; margin-bottom:12px;">
      <div style="width:6px; height:6px; border-radius:50%; background:{{dot1}};"></div>
      <div style="width:6px; height:6px; border-radius:50%; background:{{dot2}};"></div>
      <div style="width:6px; height:6px; border-radius:50%; background:{{dot3}};"></div>
    </div>

    <div style="width:100%; aspect-ratio:3/4; background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:12px; position:relative; padding:24px; margin-bottom:14px;">
      <div style="height:7px; width:60%; background:{{surfaceBorder}}; border-radius:4px; margin-bottom:12px;"></div>
      <div style="height:7px; width:85%; background:{{surfaceBorder}}; border-radius:4px; margin-bottom:12px;"></div>
      <div style="height:7px; width:75%; background:{{surfaceBorder}}; border-radius:4px; margin-bottom:12px;"></div>
      <div style="height:7px; width:80%; background:{{surfaceBorder}}; border-radius:4px;"></div>

      <sc-for list="{{currentRegions}}" as="region" hint-placeholder-count="2">
        <div style="position:absolute; top:{{region.top}}px; left:{{region.left}}px; width:{{region.width}}px; height:{{region.height}}px; background:rgba(20,20,20,0.94); border:1px solid {{accent}}; border-radius:3px;">
          <button class="iconbtn" onClick="{{region.remove}}" aria-label="Alanı kaldır" style="position:absolute; top:-9px; right:-9px; width:16px; height:16px; border-radius:50%; background:{{surface}}; border:1px solid {{surfaceBorder}}; color:{{textSoft}}; padding:0;">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </sc-for>
    </div>

    <button class="primarybtn" onClick="{{addRegion}}" style="width:100%; background:transparent; color:{{accent}}; padding:11px; border-radius:10px; font-size:13px; border:1.5px dashed {{accent}}; margin-bottom:16px;">+ Alan Ekle</button>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <div style="margin-bottom:16px;">
        <sc-if value="{{hasSummary}}" hint-placeholder-val="{{true}}">
          <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
            <sc-for list="{{summary}}" as="row" hint-placeholder-count="1">
              <div style="display:flex; align-items:center; justify-content:space-between; border:1px solid {{surfaceBorder}}; border-radius:10px; padding:10px 12px;">
                <span style="font-size:13px; font-weight:600;">Sayfa {{row.page}} — {{row.count}} alan</span>
                <button onClick="{{row.clear}}" style="font-size:12px; color:{{accent}}; font-weight:600; background:none; border:none; padding:0;">Kaldır</button>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{noSummary}}" hint-placeholder-val="{{false}}">
          <div style="border:1px dashed {{surfaceBorder}}; border-radius:10px; padding:14px; text-align:center; font-size:12px; color:{{textSoft}}; margin-bottom:12px;">Henüz işaretlenmiş alan yok</div>
        </sc-if>
        <div style="display:flex; gap:10px; padding:12px; border-radius:10px; background:{{accentSoft}};">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
          <div style="font-size:12px; color:{{text}}; line-height:1.45;">Bu alanların altındaki metin kalıcı olarak silinir, geri alınamaz.</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:12px 4px; margin-bottom:16px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:10px;">Redakte ediliyor…</div>
        <div style="height:8px; border-radius:8px; background:{{surface}}; overflow:hidden; position:relative;">
          <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:4px; margin-bottom:16px;">
        <div style="width:40px; height:40px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:700; font-size:14px;">Redaksiyon tamamlandı</div>
        <div style="font-size:12px; color:{{textSoft}};">{{totalRegions}} alan kalıcı olarak silindi</div>
      </div>
    </sc-if>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <button class="primarybtn" onClick="{{startRedact}}" disabled="{{noRegions}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">Redakte Et</button>
    </sc-if>
    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
    </sc-if>
    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
        <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
      </div>
    </sc-if>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
const TOTAL_PAGES = 3;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const regions = {};
    for (let p = 1; p <= TOTAL_PAGES; p++) regions[p] = [];
    regions[1] = [
      { id: 1, top: 76, left: 30, width: 140, height: 20 },
      { id: 2, top: 132, left: 70, width: 110, height: 20 },
    ];
    this.state = { currentPage: 1, regions: regions, nextId: 3, phase: 'idle' };
  }
  addRegion() {
    const page = this.state.currentPage;
    const presets = [
      { top: 76, left: 30, width: 140, height: 20 },
      { top: 132, left: 70, width: 110, height: 20 },
      { top: 188, left: 46, width: 160, height: 20 },
      { top: 244, left: 92, width: 90, height: 20 },
    ];
    const existing = this.state.regions[page] || [];
    const preset = presets[existing.length % presets.length];
    const id = this.state.nextId;
    this.setState({
      regions: { ...this.state.regions, [page]: [...existing, { id: id, ...preset }] },
      nextId: id + 1,
    });
  }
  removeRegion(page, id) {
    const existing = this.state.regions[page] || [];
    this.setState({
      regions: { ...this.state.regions, [page]: existing.filter((r) => r.id !== id) },
    });
  }
  clearPage(page) {
    this.setState({ regions: { ...this.state.regions, [page]: [] } });
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const totalPages = TOTAL_PAGES;
    const page = this.state.currentPage;
    const countOnPage = (p) => (this.state.regions[p] || []).length;
    const dotColor = (p) => (countOnPage(p) > 0 ? accent : (dark ? '#38383A' : '#D2D2D7'));
    const currentRegions = (this.state.regions[page] || []).map((r) => ({
      ...r,
      remove: () => this.removeRegion(page, r.id),
    }));
    const summary = Array.from({ length: TOTAL_PAGES }, (_, i) => i + 1)
      .map((p) => ({ page: p, count: countOnPage(p), clear: () => this.clearPage(p) }))
      .filter((row) => row.count > 0);
    const totalRegions = summary.reduce((sum, row) => sum + row.count, 0);
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      currentPage: page,
      totalPages: totalPages,
      noPrevPage: page <= 1,
      noNextPage: page >= totalPages,
      prevPage: () => this.setState({ currentPage: Math.max(1, page - 1) }),
      nextPage: () => this.setState({ currentPage: Math.min(totalPages, page + 1) }),
      dot1: dotColor(1),
      dot2: dotColor(2),
      dot3: dotColor(3),
      currentRegions: currentRegions,
      addRegion: () => this.addRegion(),
      summary: summary,
      hasSummary: summary.length > 0,
      noSummary: summary.length === 0,
      totalRegions: totalRegions,
      noRegions: totalRegions === 0,
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      startRedact: () => {
        this.setState({ phase: 'processing' });
        setTimeout(() => this.setState({ phase: 'done' }), 1600);
      },
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
