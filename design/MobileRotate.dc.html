<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page-thumb { cursor: pointer; transition: transform 100ms ease-out; }
    .page-thumb:active { transform: scale(0.95); }
    .pill { cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .primarybtn:disabled { opacity: 0.55; }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 6px; border-radius: 8px; display:flex; align-items:center; justify-content:center; }
    .linkbtn { cursor: pointer; border: none; background: none; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .page-thumb:active, .primarybtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <button class="iconbtn" style="color:{{textSoft}}; padding:4px;" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span style="font-weight:700; font-size:16px;">PDF Döndür</span>
  </div>

  <div style="padding:20px 16px 32px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <span style="font-size:13px; color:{{textSoft}};">rapor-2024.pdf · 6 sayfa</span>
      <button class="linkbtn" onClick="{{toggleAll}}" style="font-size:12px; color:{{accent}}; font-weight:600;">{{toggleAllLabel}}</button>
    </div>

    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:20px;">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
        <div class="page-thumb" onClick="{{p.toggle}}" style="position:relative;">
          <div style="aspect-ratio:3/4; border-radius:5px; background:{{bg}}; border:2px solid {{p.borderColor}}; transform:{{p.rotationPreview}}; transition:transform 200ms ease;"></div>
          <div style="position:absolute; top:3px; left:3px; width:13px; height:13px; border-radius:4px; background:{{p.badgeBg}}; display:flex; align-items:center; justify-content:center;">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <div style="margin-bottom:24px;">
        <div style="font-size:12px; font-weight:600; margin-bottom:10px; color:{{textSoft}}; text-transform:uppercase; letter-spacing:0.03em;">Döndürme yönü</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div class="pill" onClick="{{pickCw}}" style="border:2px solid {{border_cw}}; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            <span style="font-size:13px; font-weight:600;">90° sağa</span>
          </div>
          <div class="pill" onClick="{{pickHalf}}" style="border:2px solid {{border_half}}; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M12 3v4M21 12h-4"/></svg>
            <span style="font-size:13px; font-weight:600;">180°</span>
          </div>
          <div class="pill" onClick="{{pickCcw}}" style="border:2px solid {{border_ccw}}; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
            <span style="font-size:13px; font-weight:600;">90° sola</span>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:20px 4px; margin-bottom:24px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:14px;">Döndürülüyor…</div>
        <div style="height:8px; border-radius:8px; background:{{surface}}; overflow:hidden; position:relative;">
          <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:8px 4px; margin-bottom:24px;">
        <div style="width:48px; height:48px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:700; font-size:15px;">Döndürme tamamlandı</div>
      </div>
    </sc-if>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
        <button class="primarybtn" onClick="{{startRotate}}" disabled="{{noPagesSelected}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">Döndür</button>
      </sc-if>
      <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
        <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="display:flex; flex-direction:column; gap:12px;">
          <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
          <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
        </div>
      </sc-if>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle', angle: 'cw', selected: [1, 2, 3, 4, 5, 6] };
  }
  toggleSelected(number) {
    const selected = this.state.selected.includes(number)
      ? this.state.selected.filter((n) => n !== number)
      : [...this.state.selected, number];
    this.setState({ selected });
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const angle = this.state.angle;
    const selected = this.state.selected;
    const inactiveBorder = dark ? '#38383A' : '#D2D2D7';
    const angleDeg = angle === 'cw' ? '90deg' : angle === 'half' ? '180deg' : '-90deg';
    const border = (id) => (angle === id ? accent : inactiveBorder);
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: inactiveBorder,
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      border_cw: border('cw'),
      border_half: border('half'),
      border_ccw: border('ccw'),
      noPagesSelected: selected.length === 0,
      toggleAllLabel: selected.length === 6 ? 'Kaldır' : 'Tümü',
      pages: [1, 2, 3, 4, 5, 6].map((n) => {
        const isSelected = selected.includes(n);
        return {
          number: n,
          borderColor: isSelected ? accent : inactiveBorder,
          badgeBg: isSelected ? accent : inactiveBorder,
          rotationPreview: isSelected ? 'rotate(' + angleDeg + ')' : 'rotate(0deg)',
          toggle: () => this.toggleSelected(n),
        };
      }),
      pickCw: () => this.setState({ angle: 'cw' }),
      pickHalf: () => this.setState({ angle: 'half' }),
      pickCcw: () => this.setState({ angle: 'ccw' }),
      toggleAll: () => this.setState({ selected: selected.length === 6 ? [] : [1, 2, 3, 4, 5, 6] }),
      startRotate: () => {
        this.setState({ phase: 'processing' });
        setTimeout(() => this.setState({ phase: 'done' }), 1600);
      },
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
