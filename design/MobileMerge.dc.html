<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .primarybtn:disabled { opacity: 0.55; }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 6px; border-radius: 8px; display:flex; align-items:center; justify-content:center; transition: transform 100ms ease-out; }
    .iconbtn:active { transform: scale(0.9); }
    .iconbtn:disabled { opacity: 0.3; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .primarybtn:active, .iconbtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <button class="iconbtn" style="color:{{textSoft}}; padding:4px;" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span style="font-weight:700; font-size:16px;">PDF Birleştir</span>
  </div>

  <div style="padding:20px 16px 32px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div style="font-size:12px; font-weight:600; color:{{textSoft}}; text-transform:uppercase; letter-spacing:0.03em;">Sıra</div>
      <button class="primarybtn" onClick="{{addFile}}" style="background:transparent; color:{{accent}}; padding:6px 12px; border-radius:9px; font-size:12px; border:1px solid {{surfaceBorder}};">+ Ekle</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">
      <sc-for list="{{files}}" as="f" hint-placeholder-count="3">
        <div style="display:flex; align-items:center; gap:8px; padding:10px; border:1px solid {{surfaceBorder}}; border-radius:12px; background:{{surface}};">
          <div style="font-size:11px; font-weight:700; color:{{textSoft}}; width:16px; text-align:center;">{{f.order}}</div>
          <div style="width:30px; height:38px; border-radius:5px; background:{{accentSoft}}; border:1px solid {{surfaceBorder}}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{f.name}}</div>
            <div style="font-size:11px; color:{{textSoft}};">{{f.pages}} sayfa · {{f.size}}</div>
          </div>
          <button class="iconbtn" onClick="{{f.moveUp}}" disabled="{{f.isFirst}}" style="color:{{textSoft}};" aria-label="Yukarı">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button class="iconbtn" onClick="{{f.moveDown}}" disabled="{{f.isLast}}" style="color:{{textSoft}};" aria-label="Aşağı">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </button>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:12px; background:{{accentSoft}}; margin-bottom:24px;">
        <span style="font-size:13px; color:{{textSoft}};">{{fileCount}} dosya · {{totalPages}} sayfa</span>
        <span style="font-weight:700; font-size:13px; color:{{accent}};">→ 1 PDF</span>
      </div>
    </sc-if>

    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:20px 4px; margin-bottom:24px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:14px;">Birleştiriliyor…</div>
        <div style="height:8px; border-radius:8px; background:{{bg}}; overflow:hidden; position:relative;">
          <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:8px 4px; margin-bottom:24px;">
        <div style="width:48px; height:48px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:700; font-size:15px;">Birleştirme tamamlandı</div>
      </div>
    </sc-if>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
        <button class="primarybtn" onClick="{{startMerge}}" disabled="{{cannotMerge}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">Birleştir</button>
      </sc-if>
      <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
        <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="display:flex; flex-direction:column; gap:12px;">
          <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
          <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
        </div>
      </sc-if>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      phase: 'idle',
      list: [
        { id: 1, name: 'sozlesme.pdf', pages: 4, size: '1.1 MB' },
        { id: 2, name: 'ek-belge.pdf', pages: 2, size: '0.6 MB' },
        { id: 3, name: 'fatura.pdf', pages: 1, size: '0.3 MB' },
      ],
      nextId: 4,
    };
  }
  move(id, dir) {
    const list = [...this.state.list];
    const i = list.findIndex((x) => x.id === id);
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    this.setState({ list });
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const list = this.state.list;
    const totalPages = list.reduce((sum, f) => sum + f.pages, 0);
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      fileCount: list.length,
      totalPages: totalPages,
      cannotMerge: list.length < 2,
      files: list.map((f, idx) => ({
        name: f.name,
        pages: f.pages,
        size: f.size,
        order: idx + 1,
        isFirst: idx === 0,
        isLast: idx === list.length - 1,
        moveUp: () => this.move(f.id, -1),
        moveDown: () => this.move(f.id, 1),
      })),
      addFile: () => {
        const id = this.state.nextId;
        this.setState({
          list: [...this.state.list, { id, name: 'yeni-dosya-' + id + '.pdf', pages: 3, size: '0.8 MB' }],
          nextId: id + 1,
        });
      },
      startMerge: () => {
        this.setState({ phase: 'processing' });
        setTimeout(() => this.setState({ phase: 'done' }), 1600);
      },
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
