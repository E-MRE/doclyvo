<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .primarybtn:disabled { opacity: 0.55; }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 6px; border-radius: 8px; display:flex; align-items:center; justify-content:center; }
    .tab { cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .primarybtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <button class="iconbtn" style="color:{{textSoft}}; padding:4px;" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span style="font-weight:700; font-size:16px;">PDF İmzala</span>
  </div>

  <div style="padding:20px 16px 32px;">
    <div style="width:100%; aspect-ratio:3/4; background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:12px; position:relative; padding:24px; margin-bottom:20px;">
      <div style="height:7px; width:60%; background:{{surfaceBorder}}; border-radius:4px; margin-bottom:12px;"></div>
      <div style="height:7px; width:85%; background:{{surfaceBorder}}; border-radius:4px; margin-bottom:12px;"></div>
      <div style="height:7px; width:75%; background:{{surfaceBorder}}; border-radius:4px; margin-bottom:12px;"></div>
      <div style="height:7px; width:80%; background:{{surfaceBorder}}; border-radius:4px;"></div>

      <sc-if value="{{hasSignature}}" hint-placeholder-val="{{false}}">
        <div style="position:absolute; right:18px; bottom:18px; padding:6px 14px; border:2px solid {{accent}}; border-radius:8px; background:{{accentSoft}};">
          <span style="font-family:'Caveat', cursive; font-size:22px; color:{{accent}};">Emre Gültekir</span>
        </div>
      </sc-if>
      <sc-if value="{{noSignature}}" hint-placeholder-val="{{true}}">
        <div style="position:absolute; right:18px; bottom:18px; padding:8px 12px; border:2px dashed {{surfaceBorder}}; border-radius:8px; color:{{textSoft}}; font-size:11px;">İmza buraya</div>
      </sc-if>
    </div>

    <div style="display:flex; gap:6px; padding:4px; border-radius:10px; background:{{surface}}; margin-bottom:14px;">
      <div class="tab" onClick="{{pickDraw}}" style="flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; font-weight:600; background:{{tabbg_draw}}; color:{{tabcolor_draw}};">Çiz</div>
      <div class="tab" onClick="{{pickType}}" style="flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; font-weight:600; background:{{tabbg_type}}; color:{{tabcolor_type}};">Yaz</div>
      <div class="tab" onClick="{{pickUpload}}" style="flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; font-weight:600; background:{{tabbg_upload}}; color:{{tabcolor_upload}};">Yükle</div>
    </div>

    <sc-if value="{{modeIsUpload}}" hint-placeholder-val="{{false}}">
      <div style="border:2px dashed {{surfaceBorder}}; border-radius:12px; height:110px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; margin-bottom:16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{textSoft}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
        <div style="font-size:12px; color:{{textSoft}};">İmza görselini yükle</div>
      </div>
    </sc-if>
    <sc-if value="{{modeIsDraw}}" hint-placeholder-val="{{true}}">
      <div style="border:1px solid {{surfaceBorder}}; border-radius:12px; height:110px; display:flex; align-items:center; justify-content:center; background:{{surface}}; margin-bottom:16px;">
        <span style="font-family:'Caveat', cursive; font-size:28px;">Emre Gültekir</span>
      </div>
    </sc-if>
    <sc-if value="{{modeIsType}}" hint-placeholder-val="{{false}}">
      <div style="border:1px solid {{surfaceBorder}}; border-radius:12px; height:110px; display:flex; align-items:center; justify-content:center; background:{{surface}}; margin-bottom:16px;">
        <span style="font-family:'Caveat', cursive; font-size:30px;">Emre Gültekir</span>
      </div>
    </sc-if>

    <button class="primarybtn" onClick="{{placeSignature}}" style="width:100%; background:transparent; color:{{accent}}; padding:11px; border-radius:10px; font-size:14px; border:1px solid {{surfaceBorder}}; margin-bottom:16px;">Belgeye Yerleştir</button>

    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:12px 4px; margin-bottom:16px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:10px;">İmzalanıyor…</div>
        <div style="height:8px; border-radius:8px; background:{{surface}}; overflow:hidden; position:relative;">
          <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:4px; margin-bottom:16px;">
        <div style="width:40px; height:40px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:700; font-size:14px;">İmzalı PDF hazır</div>
      </div>
    </sc-if>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <button class="primarybtn" onClick="{{startSign}}" disabled="{{noSignature}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İmzala</button>
    </sc-if>
    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
    </sc-if>
    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
        <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
      </div>
    </sc-if>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'draw', hasSignature: false, phase: 'idle' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const mode = this.state.mode;
    const tabBg = (id) => (mode === id ? accent : 'transparent');
    const tabColor = (id) => (mode === id ? '#FFFFFF' : (dark ? '#98989D' : '#6E6E73'));
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      modeIsDraw: mode === 'draw',
      modeIsType: mode === 'type',
      modeIsUpload: mode === 'upload',
      tabbg_draw: tabBg('draw'), tabcolor_draw: tabColor('draw'),
      tabbg_type: tabBg('type'), tabcolor_type: tabColor('type'),
      tabbg_upload: tabBg('upload'), tabcolor_upload: tabColor('upload'),
      hasSignature: this.state.hasSignature,
      noSignature: !this.state.hasSignature,
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      pickDraw: () => this.setState({ mode: 'draw' }),
      pickType: () => this.setState({ mode: 'type' }),
      pickUpload: () => this.setState({ mode: 'upload', hasSignature: false }),
      placeSignature: () => this.setState({ hasSignature: true }),
      startSign: () => {
        this.setState({ phase: 'processing' });
        setTimeout(() => this.setState({ phase: 'done' }), 1600);
      },
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
