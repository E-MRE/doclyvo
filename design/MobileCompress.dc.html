<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .pill { cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, transform 100ms ease-out; }
    .pill:active { transform: scale(0.98); }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .primarybtn:disabled { opacity: 0.55; }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 8px; border-radius: 10px; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .pill:active, .primarybtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <button class="iconbtn" style="color:{{textSoft}}; padding:4px;" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span style="font-weight:700; font-size:16px;">PDF Sıkıştır</span>
  </div>

  <div style="padding:20px 16px 32px;">
    <div style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:14px; padding:14px; margin-bottom:20px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:40px; height:50px; border-radius:6px; background:{{accentSoft}}; border:1px solid {{surfaceBorder}}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:600; font-size:14px;">rapor-2024.pdf</div>
          <div style="font-size:12px; color:{{textSoft}};">18 sayfa · 8.6 MB</div>
        </div>
        <a href="#" style="font-size:12px; color:{{accent}}; font-weight:600;">Değiştir</a>
      </div>
    </div>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <div style="margin-bottom:24px;">
        <div style="font-size:12px; font-weight:600; margin-bottom:10px; color:{{textSoft}}; text-transform:uppercase; letter-spacing:0.03em;">Sıkıştırma seviyesi</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div class="pill" onClick="{{pickLow}}" style="border:2px solid {{border_low}}; border-radius:12px; padding:14px; display:flex; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-weight:600; font-size:14px;">Düşük Sıkıştırma</div>
              <div style="font-size:12px; color:{{textSoft}};">En yüksek kalite</div>
            </div>
            <div style="font-size:13px; font-weight:700; color:{{accent}};">-20%</div>
          </div>
          <div class="pill" onClick="{{pickRecommended}}" style="border:2px solid {{border_recommended}}; border-radius:12px; padding:14px; display:flex; align-items:center; justify-content:space-between; background:{{accentSoft}};">
            <div>
              <div style="font-weight:600; font-size:14px;">Önerilen</div>
              <div style="font-size:12px; color:{{textSoft}};">Kalite ve boyut dengesi</div>
            </div>
            <div style="font-size:13px; font-weight:700; color:{{accent}};">-58%</div>
          </div>
          <div class="pill" onClick="{{pickHigh}}" style="border:2px solid {{border_high}}; border-radius:12px; padding:14px; display:flex; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-weight:600; font-size:14px;">Yüksek Sıkıştırma</div>
              <div style="font-size:12px; color:{{textSoft}};">En küçük boyut</div>
            </div>
            <div style="font-size:13px; font-weight:700; color:{{accent}};">-82%</div>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:32px 4px; margin-bottom:24px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:6px;">Sıkıştırılıyor…</div>
        <div style="font-size:12px; color:{{textSoft}}; margin-bottom:18px;">Bu birkaç saniye sürebilir.</div>
        <div style="height:8px; border-radius:8px; background:{{bg}}; overflow:hidden; position:relative;">
          <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:12px 4px; margin-bottom:24px;">
        <div style="width:48px; height:48px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:700; font-size:15px; margin-bottom:4px;">Sıkıştırma tamamlandı</div>
        <div style="font-size:12px; color:{{textSoft}};">8.6 MB → 3.6 MB (-58%)</div>
      </div>
    </sc-if>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
        <button class="primarybtn" onClick="{{startCompress}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">Sıkıştır</button>
      </sc-if>
      <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
        <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="display:flex; flex-direction:column; gap:12px;">
          <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
          <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
        </div>
      </sc-if>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { quality: 'recommended', phase: 'idle' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const q = this.state.quality;
    const border = (id) => (q === id ? accent : (dark ? '#38383A' : '#D2D2D7'));
    const startCompress = () => {
      this.setState({ phase: 'processing' });
      setTimeout(() => this.setState({ phase: 'done' }), 1600);
    };
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      phase: this.state.phase,
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      border_low: border('low'),
      border_recommended: border('recommended'),
      border_high: border('high'),
      pickLow: () => this.setState({ quality: 'low' }),
      pickRecommended: () => this.setState({ quality: 'recommended' }),
      pickHigh: () => this.setState({ quality: 'high' }),
      startCompress: startCompress,
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
