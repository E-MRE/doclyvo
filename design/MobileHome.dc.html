<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    .toolcard { transition: transform 0.15s ease; cursor: pointer; }
    .toolcard:active { transform: scale(0.97); }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 8px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    @media (prefers-reduced-motion: reduce) {
      .toolcard:active, .primarybtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:28px; height:28px; border-radius:8px; background:{{accent}}; display:flex; align-items:center; justify-content:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      </div>
      <span style="font-weight:800; font-size:17px; letter-spacing:-0.02em;">doclyvo</span>
    </div>
    <button class="iconbtn" onClick="{{toggleTheme}}" style="color:{{textSoft}};" aria-label="Tema değiştir">
      <sc-if value="{{notDark}}" hint-placeholder-val="{{true}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </sc-if>
      <sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </sc-if>
    </button>
  </div>

  <div style="padding:24px 16px 8px;">
    <h1 style="font-weight:800; font-size:26px; line-height:1.15; letter-spacing:-0.01em; margin:0 0 10px;">PDF işleri iş gibi hissettirmek zorunda değil.</h1>
    <p style="font-size:14px; line-height:1.55; color:{{textSoft}}; margin:0 0 20px;">Birleştir, böl, sıkıştır, dönüştür ve imzala — hepsi tek arayüzde.</p>

    <div style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:16px; padding:18px; margin-bottom:28px; box-shadow:0 12px 30px -16px rgba(0,0,0,0.16);">
      <sc-if value="{{noFile}}" hint-placeholder-val="{{true}}">
        <div style="border:2px dashed {{surfaceBorder}}; border-radius:12px; padding:28px 16px; text-align:center;">
          <div style="width:44px; height:44px; border-radius:12px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
          </div>
          <div style="font-weight:600; font-size:14px; margin-bottom:4px;">Dosyanı buraya bırak</div>
          <div style="font-size:12px; color:{{textSoft}}; margin-bottom:16px;">PDF, PNG veya JPEG</div>
          <button class="primarybtn" onClick="{{chooseFile}}" style="background:{{accent}}; color:#FFFFFF; padding:11px 20px; border-radius:10px; font-size:14px;">Dosya Seç</button>
        </div>
      </sc-if>
      <sc-if value="{{hasFile}}" hint-placeholder-val="{{false}}">
        <div style="display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:{{accentSoft}};">
          <div style="width:34px; height:34px; border-radius:9px; background:{{accent}}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{fileName}}</div>
            <div style="font-size:11px; color:{{textSoft}};">2.4 MB</div>
          </div>
          <button class="iconbtn" onClick="{{clearFile}}" style="color:{{textSoft}}; padding:4px;" aria-label="Kaldır">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </sc-if>
    </div>

    <h2 style="font-weight:800; font-size:18px; margin:0 0 4px;">En çok kullanılan araçlar</h2>
    <p style="font-size:13px; color:{{textSoft}}; margin:0 0 16px;">Bir araç seç, dosyanı bırak.</p>

    <div style="display:grid; grid-template-columns:repeat(2, 1fr); grid-auto-rows:120px; gap:12px; padding-bottom:32px;">

      <div class="toolcard" onClick="{{selectCompress}}" style="grid-column:span 2; background:{{accentSoft}}; border:2px solid {{selectedTool_compress_border}}; border-radius:16px; padding:16px; display:flex; align-items:center; gap:14px; position:relative; overflow:hidden;">
        <div style="width:42px; height:42px; border-radius:11px; background:{{accent}}; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; z-index:1;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v4a1 1 0 0 1-1 1H3M16 3v4a1 1 0 0 0 1 1h4M8 21v-4a1 1 0 0 0-1-1H3M16 21v-4a1 1 0 0 1 1-1h4"/></svg>
        </div>
        <div style="position:relative; z-index:1;">
          <div style="font-weight:700; font-size:15px;">Sıkıştır</div>
          <div style="font-size:12px; color:{{textSoft}};">Öne çıkan araç</div>
        </div>
      </div>

      <div class="toolcard" onClick="{{selectMerge}}" style="background:{{surface}}; border:2px solid {{selectedTool_merge_border}}; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="width:34px; height:34px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
        </div>
        <div style="font-weight:600; font-size:13px;">Birleştir</div>
      </div>

      <div class="toolcard" onClick="{{selectConvert}}" style="background:{{surface}}; border:2px solid {{selectedTool_convert_border}}; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="width:34px; height:34px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v13"/></svg>
        </div>
        <div style="font-weight:600; font-size:13px;">PDF to Word</div>
      </div>

      <div class="toolcard" onClick="{{selectSign}}" style="background:{{surface}}; border:2px solid {{selectedTool_sign_border}}; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="width:34px; height:34px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17s2-1 4-1 3 1 5 1 3-1 5-1 4 1 4 1M4 14 14 4l3 3-10 10H4z"/></svg>
        </div>
        <div style="font-weight:600; font-size:13px;">İmzala</div>
      </div>

      <div class="toolcard" onClick="{{selectSplit}}" style="background:{{surface}}; border:2px solid {{selectedTool_split_border}}; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="width:34px; height:34px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M12 3v18"/></svg>
        </div>
        <div style="font-weight:600; font-size:13px;">Böl</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { darkOverride: null, hasFile: false, fileName: '', selectedTool: 'compress' };
  }
  renderVals() {
    const dark = this.state.darkOverride ?? (this.props.dark ?? false);
    const accent = this.props.accent ?? '#DC4731';
    const sel = this.state.selectedTool;
    const borderFor = (id) => (sel === id ? accent : (dark ? '#38383A' : '#D2D2D7'));
    return {
      dark: dark,
      notDark: !dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      hasFile: this.state.hasFile,
      noFile: !this.state.hasFile,
      fileName: this.state.fileName,
      selectedTool_compress_border: borderFor('compress'),
      selectedTool_merge_border: borderFor('merge'),
      selectedTool_convert_border: borderFor('convert'),
      selectedTool_sign_border: borderFor('sign'),
      selectedTool_split_border: borderFor('split'),
      toggleTheme: () => this.setState({ darkOverride: !dark }),
      chooseFile: () => this.setState({ hasFile: true, fileName: 'rapor-2024.pdf' }),
      clearFile: () => this.setState({ hasFile: false, fileName: '' }),
      selectMerge: () => this.setState({ selectedTool: 'merge' }),
      selectSplit: () => this.setState({ selectedTool: 'split' }),
      selectCompress: () => this.setState({ selectedTool: 'compress' }),
      selectConvert: () => this.setState({ selectedTool: 'convert' }),
      selectSign: () => this.setState({ selectedTool: 'sign' }),
    };
  }
}
</script>
</body>
</html>
