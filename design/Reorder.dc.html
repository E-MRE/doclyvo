<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.72; }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out, opacity 150ms ease; }
    .primarybtn:hover { opacity: 0.9; }
    .primarybtn:active { transform: scale(0.97); }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 6px; border-radius: 8px; transition: transform 100ms ease-out, opacity 150ms ease; display:flex; align-items:center; justify-content:center; }
    .iconbtn:hover { opacity: 0.75; }
    .iconbtn:active { transform: scale(0.92); }
    .iconbtn:disabled { opacity: 0.3; cursor: default; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .primarybtn:active, .iconbtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:1440px; min-height:900px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 48px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:34px; height:34px; border-radius:10px; background:{{accent}}; display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
        </div>
        <span style="font-weight:800; font-size:20px; letter-spacing:-0.02em;">doclyvo</span>
      </div>
      <div style="width:1px; height:22px; background:{{surfaceBorder}};"></div>
      <a href="#" style="font-size:14px; color:{{textSoft}}; display:flex; align-items:center; gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Tüm Araçlar
      </a>
    </div>
    <button style="background:none; border:none; color:{{textSoft}}; font-size:13px; cursor:pointer;">Yardım</button>
  </div>

  <div style="max-width:1040px; margin:0 auto; padding:56px 24px;">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
      <div style="width:44px; height:44px; border-radius:12px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </div>
      <h1 style="font-weight:800; font-size:28px; margin:0;">Sayfaları Yeniden Sırala</h1>
    </div>
    <p style="font-size:15px; color:{{textSoft}}; margin:0 0 36px 58px;">Sayfaları sürükle veya oklarla istediğin sıraya getir.</p>

    <div style="display:grid; grid-template-columns:1fr 380px; gap:24px;">

      <div style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:16px; padding:22px;">
        <div style="display:flex; align-items:center; gap:14px; padding-bottom:18px; border-bottom:1px solid {{surfaceBorder}}; margin-bottom:18px;">
          <div style="width:38px; height:48px; border-radius:6px; background:{{accentSoft}}; border:1px solid {{surfaceBorder}}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </div>
          <div>
            <div style="font-weight:600; font-size:15px;">rapor-2024.pdf</div>
            <div style="font-size:13px; color:{{textSoft}};">6 sayfa</div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:12px;">
          <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
            <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
              <div style="position:relative; width:100%;">
                <div style="aspect-ratio:3/4; border-radius:6px; background:{{bg}}; border:1px solid {{surfaceBorder}};"></div>
                <div style="position:absolute; bottom:4px; right:4px; font-size:10px; font-weight:700; color:{{textSoft}}; background:{{surface}}; padding:1px 5px; border-radius:6px;">{{p.originalNumber}}</div>
              </div>
              <div style="display:flex; align-items:center; gap:2px;">
                <button class="iconbtn" onClick="{{p.moveLeft}}" disabled="{{p.isFirst}}" style="color:{{textSoft}};" aria-label="Sola taşı">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <span style="font-size:11px; font-weight:700; color:{{textSoft}}; width:14px; text-align:center;">{{p.position}}</span>
                <button class="iconbtn" onClick="{{p.moveRight}}" disabled="{{p.isLast}}" style="color:{{textSoft}};" aria-label="Sağa taşı">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:22px;">

        <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
          <div>
            <div style="font-size:13px; font-weight:600; margin-bottom:12px; color:{{textSoft}}; text-transform:uppercase; letter-spacing:0.03em;">Yeni sıra</div>
            <div style="font-size:13px; color:{{textSoft}}; line-height:1.7; padding:12px 14px; border-radius:12px; background:{{accentSoft}};">{{orderSummary}}</div>
          </div>
        </sc-if>

        <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
          <div style="text-align:center; padding:24px 4px;">
            <div style="font-weight:600; font-size:15px; margin-bottom:6px;">Yeniden sıralanıyor…</div>
            <div style="font-size:13px; color:{{textSoft}}; margin-bottom:20px;">Bu birkaç saniye sürebilir.</div>
            <div style="height:8px; border-radius:8px; background:{{bg}}; overflow:hidden; position:relative;">
              <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
          <div style="text-align:center; padding:8px 4px;">
            <div style="width:52px; height:52px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <div style="font-weight:700; font-size:16px; margin-bottom:4px;">Sıralama tamamlandı</div>
            <div style="font-size:13px; color:{{textSoft}};">Yeni sıra kaydedildi</div>
          </div>
        </sc-if>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
            <button class="primarybtn" onClick="{{startReorder}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">Sırala</button>
          </sc-if>
          <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
            <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
          </sc-if>
          <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
            <div style="display:flex; flex-direction:column; gap:12px;">
              <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
              <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
            </div>
          </sc-if>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle', order: [1, 2, 3, 4, 5, 6] };
  }
  move(originalNumber, dir) {
    const order = [...this.state.order];
    const i = order.indexOf(originalNumber);
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    this.setState({ order });
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const order = this.state.order;
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      orderSummary: 'Sayfa sırası: ' + order.join(' → '),
      pages: order.map((originalNumber, idx) => ({
        originalNumber: originalNumber,
        position: idx + 1,
        isFirst: idx === 0,
        isLast: idx === order.length - 1,
        moveLeft: () => this.move(originalNumber, -1),
        moveRight: () => this.move(originalNumber, 1),
      })),
      startReorder: () => {
        this.setState({ phase: 'processing' });
        setTimeout(() => this.setState({ phase: 'done' }), 1600);
      },
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
