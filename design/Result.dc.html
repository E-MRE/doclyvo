<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.72; }
    .toolchip { cursor: pointer; transition: transform 0.15s ease; }
    .toolchip:hover { transform: translateY(-2px); }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    .primarybtn { transition: transform 100ms ease-out, opacity 150ms ease; }
    .primarybtn:hover { opacity: 0.9; }
    .primarybtn:active { transform: scale(0.97); }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 8px; border-radius: 10px; }
    .iconbtn { transition: transform 100ms ease-out, opacity 150ms ease; }
    .iconbtn:hover { opacity: 0.75; }
    .iconbtn:active { transform: scale(0.92); }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: pop 0.4s ease; }
    @media (prefers-reduced-motion: reduce) {
      .pop-in { animation: none; }
      .toolchip:hover, .primarybtn:active, .iconbtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:1440px; min-height:900px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 48px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:34px; height:34px; border-radius:10px; background:{{accent}}; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      </div>
      <span style="font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; font-weight:800; font-size:20px; letter-spacing:-0.02em;">doclyvo</span>
    </div>
    <button class="iconbtn" onClick="{{toggleTheme}}" style="color:{{textSoft}};" aria-label="Tema değiştir">
      <sc-if value="{{notDark}}" hint-placeholder-val="{{true}}">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </sc-if>
      <sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </sc-if>
    </button>
  </div>

  <div style="max-width:680px; margin:0 auto; padding:64px 24px 40px; text-align:center;">
    <div class="pop-in" style="width:64px; height:64px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 22px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1 style="font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; font-weight:800; font-size:30px; margin:0 0 8px;">Dosyan hazır</h1>
    <p style="font-size:15px; color:{{textSoft}}; margin:0 0 32px;">rapor-2024.pdf sıkıştırıldı ve indirilmeye hazır.</p>

    <div style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:16px; padding:24px; margin-bottom:20px; text-align:left;">
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px;">
        <div style="width:46px; height:56px; border-radius:6px; background:{{accentSoft}}; border:1px solid {{surfaceBorder}}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:600; font-size:15px;">rapor-2024-sikistirilmis.pdf</div>
          <div style="font-size:13px; color:{{textSoft}};">18 sayfa</div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:16px; margin-bottom:6px;">
        <div style="flex:1;">
          <div style="font-size:12px; color:{{textSoft}}; margin-bottom:6px;">Önce</div>
          <div style="height:10px; border-radius:6px; background:{{bg}}; overflow:hidden;">
            <div style="width:100%; height:100%; background:{{surfaceBorder}};"></div>
          </div>
          <div style="font-size:13px; font-weight:600; margin-top:6px;">8.6 MB</div>
        </div>
        <div style="flex:1;">
          <div style="font-size:12px; color:{{textSoft}}; margin-bottom:6px;">Sonra</div>
          <div style="height:10px; border-radius:6px; background:{{bg}}; overflow:hidden;">
            <div style="width:42%; height:100%; background:{{accent}};"></div>
          </div>
          <div style="font-size:13px; font-weight:600; margin-top:6px; color:{{accent}};">3.6 MB · -58%</div>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:12px; margin-bottom:12px;">
      <button class="primarybtn" style="flex:1; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
        İndir
      </button>
      <button class="primarybtn" style="background:transparent; color:{{text}}; padding:15px 20px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}}; display:flex; align-items:center; gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5"/></svg>
        Bağlantıyı Kopyala
      </button>
    </div>
    <div style="font-size:12px; color:{{textSoft}};">Dosyan 24 saat sonra sunucudan otomatik silinir.</div>
  </div>

  <div style="max-width:900px; margin:0 auto; padding:24px 24px 72px;">
    <div style="text-align:center; font-size:13px; font-weight:600; color:{{textSoft}}; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:16px;">Başka bir işlem yap</div>
    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;">
      <div class="toolchip" style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:14px; padding:18px; text-align:center;">
        <div style="width:36px; height:36px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
        </div>
        <div style="font-size:13px; font-weight:600;">Birleştir</div>
      </div>
      <div class="toolchip" style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:14px; padding:18px; text-align:center;">
        <div style="width:36px; height:36px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M12 3v18"/></svg>
        </div>
        <div style="font-size:13px; font-weight:600;">Böl</div>
      </div>
      <div class="toolchip" style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:14px; padding:18px; text-align:center;">
        <div style="width:36px; height:36px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v13"/></svg>
        </div>
        <div style="font-size:13px; font-weight:600;">PDF to Word</div>
      </div>
      <div class="toolchip" style="background:{{surface}}; border:1px solid {{surfaceBorder}}; border-radius:14px; padding:18px; text-align:center;">
        <div style="width:36px; height:36px; border-radius:10px; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17s2-1 4-1 3 1 5 1 3-1 5-1 4 1 4 1M4 14 14 4l3 3-10 10H4z"/></svg>
        </div>
        <div style="font-size:13px; font-weight:600;">İmzala</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { darkOverride: null };
  }
  renderVals() {
    const dark = this.state.darkOverride ?? (this.props.dark ?? false);
    const accent = this.props.accent ?? '#DC4731';
    return {
      dark: dark,
      notDark: !dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      toggleTheme: () => this.setState({ darkOverride: !dark }),
    };
  }
}
</script>
</body>
</html>
