<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .primarybtn { cursor: pointer; border: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; transition: transform 100ms ease-out; }
    .primarybtn:active { transform: scale(0.97); }
    .iconbtn { cursor: pointer; border: none; background: none; padding: 4px; border-radius: 6px; display:flex; align-items:center; justify-content:center; transition: transform 100ms ease-out; }
    .iconbtn:active { transform: scale(0.9); }
    .iconbtn:disabled { opacity: 0.3; }
    @keyframes barmove { 0% { transform: translateX(-60%); } 100% { transform: translateX(160%); } }
    .bar-indeterminate { animation: barmove 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar-indeterminate { animation: none; left:0; width:100%; opacity:0.5; }
      .primarybtn:active, .iconbtn:active { transform: none; }
    }
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:{{bg}}; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color:{{text}};">

  <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid {{surfaceBorder}}; background:color-mix(in srgb, {{surface}} 72%, transparent); backdrop-filter:blur(20px) saturate(180%); position:sticky; top:0; z-index:5;">
    <button class="iconbtn" style="color:{{textSoft}}; padding:4px;" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span style="font-weight:700; font-size:16px;">Sayfaları Sırala</span>
  </div>

  <div style="padding:20px 16px 32px;">
    <div style="font-size:13px; color:{{textSoft}}; margin-bottom:12px;">rapor-2024.pdf · 6 sayfa</div>

    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px;">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
        <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
          <div style="position:relative; width:100%;">
            <div style="aspect-ratio:3/4; border-radius:5px; background:{{surface}}; border:1px solid {{surfaceBorder}};"></div>
            <div style="position:absolute; bottom:3px; right:3px; font-size:9px; font-weight:700; color:{{textSoft}}; background:{{bg}}; padding:1px 4px; border-radius:5px;">{{p.originalNumber}}</div>
          </div>
          <div style="display:flex; align-items:center; gap:2px;">
            <button class="iconbtn" onClick="{{p.moveLeft}}" disabled="{{p.isFirst}}" style="color:{{textSoft}};" aria-label="Sola">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <span style="font-size:10px; font-weight:700; color:{{textSoft}}; width:12px; text-align:center;">{{p.position}}</span>
            <button class="iconbtn" onClick="{{p.moveRight}}" disabled="{{p.isLast}}" style="color:{{textSoft}};" aria-label="Sağa">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
      <div style="font-size:12px; color:{{textSoft}}; line-height:1.6; padding:12px 14px; border-radius:12px; background:{{surface}}; margin-bottom:24px;">{{orderSummary}}</div>
    </sc-if>

    <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:20px 4px; margin-bottom:24px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:14px;">Yeniden sıralanıyor…</div>
        <div style="height:8px; border-radius:8px; background:{{surface}}; overflow:hidden; position:relative;">
          <div class="bar-indeterminate" style="position:absolute; top:0; left:0; width:40%; height:100%; border-radius:8px; background:{{accent}};"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:8px 4px; margin-bottom:24px;">
        <div style="width:48px; height:48px; border-radius:50%; background:{{accentSoft}}; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:700; font-size:15px;">Sıralama tamamlandı</div>
      </div>
    </sc-if>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
        <button class="primarybtn" onClick="{{startReorder}}" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">Sırala</button>
      </sc-if>
      <sc-if value="{{isProcessing}}" hint-placeholder-val="{{false}}">
        <button class="primarybtn" disabled style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İşleniyor…</button>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="display:flex; flex-direction:column; gap:12px;">
          <button class="primarybtn" style="width:100%; background:{{accent}}; color:#FFFFFF; padding:15px; border-radius:12px; font-size:15px;">İndir</button>
          <button class="primarybtn" onClick="{{reset}}" style="width:100%; background:transparent; color:{{text}}; padding:13px; border-radius:12px; font-size:14px; border:1px solid {{surfaceBorder}};">Yeni İşlem</button>
        </div>
      </sc-if>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"accent":{"editor":"color","default":"#DC4731","section":"Marka"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle', order: [1, 2, 3, 4, 5, 6] };
  }
  move(originalNumber, dir) {
    const order = [...this.state.order];
    const i = order.indexOf(originalNumber);
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    this.setState({ order });
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#DC4731';
    const order = this.state.order;
    return {
      dark: dark,
      accent: accent,
      bg: dark ? '#000000' : '#F5F5F7',
      surface: dark ? '#1C1C1E' : '#FFFFFF',
      surfaceBorder: dark ? '#38383A' : '#D2D2D7',
      text: dark ? '#F5F5F7' : '#1D1D1F',
      textSoft: dark ? '#98989D' : '#6E6E73',
      accentSoft: 'color-mix(in oklch, ' + accent + ' ' + (dark ? '22%' : '12%') + ', ' + (dark ? 'black' : 'white') + ')',
      isIdle: this.state.phase === 'idle',
      isProcessing: this.state.phase === 'processing',
      isDone: this.state.phase === 'done',
      orderSummary: 'Sayfa sırası: ' + order.join(' → '),
      pages: order.map((originalNumber, idx) => ({
        originalNumber: originalNumber,
        position: idx + 1,
        isFirst: idx === 0,
        isLast: idx === order.length - 1,
        moveLeft: () => this.move(originalNumber, -1),
        moveRight: () => this.move(originalNumber, 1),
      })),
      startReorder: () => {
        this.setState({ phase: 'processing' });
        setTimeout(() => this.setState({ phase: 'done' }), 1600);
      },
      reset: () => this.setState({ phase: 'idle' }),
    };
  }
}
</script>
</body>
</html>
